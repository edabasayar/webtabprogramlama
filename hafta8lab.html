<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafta 8 - CSS Animasyon & Bootstrap</title>

  <!-- Bootstrap CSS dosyası -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <style>
    /* Sayfa genel ayarları */
    body {
      background-color: #f5f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Ortak kutu stilleri */
    .anim-box {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 20px auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Göz ve ağız */
    .eyes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 5px;
    }

    .eye {
      width: 10px;
      height: 10px;
      background-color: black;
      border-radius: 50%;
    }

    .mouth {
      width: 40px;
      height: 10px;
      background-color: black;
      border-radius: 15px;
    }

    /* 🔹 1. Yukarı-aşağı hareket eden */
    .up-down {
      background-color: #6f42c1;
      animation: upDown 2s ease-in-out infinite alternate;
    }
    @keyframes upDown {
      from { transform: translateY(0); }
      to { transform: translateY(-60px); }
    }

    /* 🔹 2. Büyüyüp küçülen ve rengi değişen */
    .grow-color {
      background-color: #dc3545;
      animation: growColor 3s ease-in-out infinite;
    }
    @keyframes growColor {
      0%   { transform: scale(1); background-color: #dc3545; }
      50%  { transform: scale(1.3); background-color: #ffc107; }
      100% { transform: scale(1); background-color: #28a745; }
    }

    /* 🔹 3. Transparan değeri değişen */
    .fade {
      background-color: #e83e8c;
      animation: fadeAnim 3s ease-in-out infinite;
    }
    @keyframes fadeAnim {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 🔹 4. Sağa-sola hareket eden */
    .left-right {
      background-color: #007bff;
      animation: leftRight 2s linear infinite alternate;
    }
    @keyframes leftRight {
      from { transform: translateX(0); }
      to { transform: translateX(70px); }
    }

    /* 🔹 5. Dönen */
    .rotate {
      background-color: #20c997;
      animation: rotateAnim 3s linear infinite;
    }
    @keyframes rotateAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Gölge efekti */
    .anim-box::after {
      content: "";
      position: absolute;
      bottom: -12px;
      width: 70%;
      height: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      filter: blur(3px);
      left: 15%;
    }
