<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hafta 7 - CSS Animasyon ve Bootstrap</title>

  <!-- Bootstrap CSS bağlantısı -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
  >

  <style>
    /* Sayfa genel görünümü */
    body {
      background-color: #fdf3d7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Comic Sans MS", sans-serif;
    }

    h2 {
      color: #343a40;
      margin-bottom: 40px;
    }

    /* Ortak div stilleri */
    .anim-div {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 20px auto;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      color: white;
      font-weight: bold;
    }

    /* Göz ve ağız */
    .eyes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 5px;
    }

    .eye {
      width: 10px;
      height: 10px;
      background: black;
      border-radius: 50%;
    }

    .mouth {
      width: 40px;
      height: 10px;
      background: black;
      border-radius: 15px;
    }

    /* 1️⃣ Yukarı aşağı hareket eden */
    .upDown {
      background-color: #6f42c1;
      animation: upDown 2s ease-in-out infinite alternate;
    }
    @keyframes upDown {
      from { transform: translateY(0); }
      to { transform: translateY(-60px); }
    }

    /* 2️⃣ Büyüyüp küçülen ve rengi değişen */
    .growColor {
      background-color: #dc3545;
      animation: growColor 3s ease-in-out infinite;
    }
    @keyframes growColor {
      0%   { transform: scale(1); background-color: #dc3545; }
      50%  { transform: scale(1.3); background-color: #ffc107; }
      100% { transform: scale(1); background-color: #28a745; }
    }

    /* 3️⃣ Transparan değeri değişen */
    .fade {
      background-color: #e83e8c;
      animation: fadeAnim 3s ease-in-out infinite;
    }
    @keyframes fadeAnim {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 4️⃣ Sağa sola hareket eden */
    .leftRight {
      background-color: #007bff;
      animation: leftRight 2s linear infinite alternate;
    }
    @keyframes leftRight {
      from { transform: translateX(0); }
      to { transform: translateX(70px); }
    }

    /* 5️⃣ Dönen */
    .rotate {
      background-color: #20c997;
      animation: rotateAnim 3s linear infinite;
    }
    @keyframes rotateAnim {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Gölge efekti */
    .anim-div::after {
      content: "";
      position: absolute;
      bottom: -12px;
      width: 70%;
      height: 10px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      filter: blur(3px);
      left: 15%;
    }

  </style>
</head>
<body>

  <h2>🎨 Animasyon (Hafta 8)</h2>

  <!-- Bootstrap yapısı -->
  <div class="container">
    <div class="row justify-content-center">

      <!-- 1️⃣ Yukarı-Aşağı -->
      <div class="col-6 col-md-2">
        <div class="anim-div upDown">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Yukarı-Aşağı</p>
      </div>

      <!-- 2️⃣ Büyüme-Renk -->
      <div class="col-6 col-md-2">
        <div class="anim-div growColor">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Büyüme & Renk</p>
      </div>

      <!-- 3️⃣ Transparan -->
      <div class="col-6 col-md-2">
        <div class="anim-div fade">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Transparan</p>
      </div>

      <!-- 4️⃣ Sağa-Sola -->
      <div class="col-6 col-md-2">
        <div class="anim-div leftRight">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Sağa-Sola</p>
      </div>

      <!-- 5️⃣ Dönen -->
      <div class="col-6 col-md-2">
        <div class="anim-div rotate">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
        <p class="text-dark mt-2">Dönen</p>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS dosyaları -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
