<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hareketli Karakterler</title>
  <style>
    body {
      background-color: #f8f1c3;
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 30px;
      height: 100vh;
      font-family: "Comic Sans MS", sans-serif;
    }

    .ball {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000;
      font-size: 14px;
    }

    /* 1. Yukarı-aşağı hareket eden */
    .ball1 {
      background-color: purple;
      animation: upDown 2s ease-in-out infinite;
    }
    @keyframes upDown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-50px); }
    }

    /* 2. Büyüyüp küçülen ve rengi değişen */
    .ball2 {
      background-color: tomato;
      animation: growChange 3s ease-in-out infinite;
    }
    @keyframes growChange {
      0% { transform: scale(1); background-color: tomato; }
      50% { transform: scale(1.3); background-color: gold; }
      100% { transform: scale(1); background-color: tomato; }
    }

    /* 3. Transparanlığı değişen */
    .ball3 {
      background-color: palevioletred;
      animation: fade 3s ease-in-out infinite;
    }
    @keyframes fade {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* 4. Sağa sola giden gelen */
    .ball4 {
      background-color: cornflowerblue;
      animation: leftRight 2.5s ease-in-out infinite;
    }
    @keyframes leftRight {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(70px); }
    }

    /* 5. Dönen */
    .ball5 {
      background-color: mediumseagreen;
      animation: rotate 3s linear infinite;
    }
    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Gölge efekti */
    .ball::after {
      content: "";
      position: absolute;
      bottom: -10px;
      width: 70%;
      height: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 50%;
      filter: blur(3px);
    }
  </style>
</head>
<body>
  <div class="ball ball1">Yukarı-Aşağı</div>
  <div class="ball ball2">Büyü-Renk</div>
  <div class="ball ball3">Transparan</div>
  <div class="ball ball4">Sağa-Sola</div>
  <div class="ball ball5">Dönen</div>
</body>
</html>
