<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB Programcılığı Bilgi Testi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #f9fafc;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        fieldset {
            margin-bottom: 25px;
            border: 1px solid #007bff;
            padding: 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 0 8px rgba(0,0,0,0.05);
        }

        legend {
            font-size: 1.2em;
            font-weight: bold;
            color: #007bff;
            padding: 0 10px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .input-group {
            margin-bottom: 18px;
        }

        input[type=text],
        input[type=number],
        input[type=date],
        input[type=time],
        input[type=url],
        input[type=search],
        textarea {
            width: 97%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
        }

        .submit-button {
            padding: 12px 20px;
            background-color: #28a745;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            margin-right: 10px;
        }

        .reset-button {
            padding: 12px 20px;
            background-color: #dc3545;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.9em;
            color: #555;
            text-align: center;
        }

    </style>
</head>

<body>

    <form action="sonuclar.php" method="POST">

        <h1>WEB Programcılığı Bilgi Testi</h1>

        <!-- BÖLÜM A -->
        <fieldset>
            <legend>Bölüm A: Temel Kavramlar</legend>

            <div class="input-group">
                <label for="ad_soyad">1. Adınız ve Soyadınız:</label>
                <input type="text" id="ad_soyad" name="isim_soyisim" required>
            </div>

            <div class="input-group">
                <label>2. HTML belgesinin davranışını hangi teknoloji belirler?</label>
                <input type="radio" id="cevap_a" name="soru2" value="html">
                <label for="cevap_a" style="display:inline;">HTML</label><br>

                <input type="radio" id="cevap_b" name="soru2" value="css">
                <label for="cevap_b" style="display:inline;">CSS</label><br>

                <input type="radio" id="cevap_c" name="soru2" value="js">
                <label for="cevap_c" style="display:inline;">JavaScript</label>
            </div>

            <div class="input-group">
                <label>3. Bu dersin içeriğinde hangi diller bulunmaktadır? (Birden fazla işaretleyebilirsiniz)</label>
                <input type="checkbox" id="html" name="diller[]" value="html">
                <label for="html" style="display:inline;">HTML5</label><br>

                <input type="checkbox" id="javascript" name="diller[]" value="javascript">
                <label for="javascript" style="display:inline;">JavaScript</label><br>
               
                <input type="checkbox" id="css" name="diller[]" value="css">
                <label for="css" style="display:inline;">CSS</label><br>

                <input type="checkbox" id="php" name="diller[]" value="php">
                <label for="php" style="display:inline;">PHP</label><br>

                <input type="checkbox" id="sql" name="diller[]" value="sql">
                <label for="sql" style="display:inline;">SQL</label><br>

                <input type="checkbox" id="python" name="diller[]" value="python">
                <label for="python" style="display:inline;">Python</label>
            </div>

            <div class="input-group">
                <label for="yorum">4. Web geliştirme deneyimlerinizi kısaca anlatınız:</label>
                <textarea id="yorum" name="deneyim_yorum" rows="4"></textarea>
            </div>

        </fieldset>

        <!-- BÖLÜM B -->
        <fieldset>
            <legend>Bölüm B: HTML5 Giriş Türleri</legend>

            <div class="input-group">
                <label for="dom_depth">5. DOM Derinliğini tahmin ediniz (1 - 50):</label>
                <input type="number" id="dom_depth" name="tahmin_derinlik" min="1" max="50">
            </div>

            <div class="input-group">
                <label for="kalite_puan">6. Bu arayüzü 0 - 100 arasında puanlayınız:</label>
                <input type="range" id="kalite_puan" name="kalite" min="0" max="100" value="50">
            </div>

            <div class="input-group">
                <label for="baslangic_tarihi">7. Kursa başlama tarihiniz:</label>
                <input type="date" id="baslangic_tarihi" name="baslangic_tarihi">
            </div>

            <div class="input-group">
                <label for="bitis_saati">8. Testi tamamlama saatiniz:</label>
                <input type="time" id="bitis_saati" name="bitis_saati">
            </div>

            <div class="input-group">
                <label for="renk">9. Kullanmayı en sevdiğiniz renk:</label>
                <input type="color" id="renk" name="favori_renk" value="#007bff">
            </div>

            <div class="input-group">
                <label for="dosya">10. Çalışma dosyanızı yükleyiniz:</label>
                <input type="file" id="dosya" name="odev_dosyasi">
            </div>

            <div class="input-group">
                <label for="url_giris">11. Proje URL’niz (Github, 000Webhost vb.):</label>
                <input type="url" id="url_giris" name="proje_url" placeholder="https://ornek.com">
            </div>

         <div class="input-group">
    <label for="arama_input">12. En zorlandığınız konuyu yazın:</label>
    <input type="search" id="arama_input" name="arama_terimi" placeholder="Örn: Flexbox">
</div>

        </fieldset>

        <!-- GİZLİ ALAN -->
        <input type="hidden" name="test_versiyon" value="1.0">

        <!-- BUTONLAR -->
        <button type="submit" class="submit-button">Testi Gönder</button>
        <button type="reset" class="reset-button">Cevapları Sıfırla</button>

        <p class="footer-note">Hazırlayan: Eda — WEB Programcılığı Dersi Test Arayüzü</p>

    </form>

</body>
</html>
