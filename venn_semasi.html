<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venn Diyagramı</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #fafafa; 
            font-family: Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 420px;
            height: 420px;
        }

        .circle {
            position: absolute;
            width: 210px; 
            height: 210px;
            border-radius: 50%;
            mix-blend-mode: multiply;
            opacity: 0.75;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            box-shadow: 0px 0px 12px rgba(0,0,0,0.15);
        }

        .red-orange {
            background-color: #ff6b5b; 
            top: 60px;
            left: 50px;
        }

        .yellow {
            background-color: #ffe259; 
            top: 160px;
            left: 105px;
        }

        .blue {
            background-color: #6aa9ff;
            top: 60px;
            left: 160px;
        }

        .center-text {
            position: absolute;
            top: 150px;
            left: 155px;
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="circle red-orange"><span>A</span></div>
        <div class="circle yellow"><span>B</span></div>
        <div class="circle blue"><span>C</span></div>

        <div class="center-text">A ∩ B ∩ C</div>
    </div>

</body>
</html>
